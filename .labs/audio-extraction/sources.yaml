  - url: https://www.instagram.com/reel/DeChNonMdOQ/
    name: Deep Learning Statistical Arbitrage (Stanford paper explainer)
    status: skipped
    cache_key: 13233f413fe3
    tags: [equities, stat-arb, market-neutral, ml, legit, engine-gap]
    note: >-
      BEST-SOURCED reel in the queue, and skipped for ENGINE reasons, not
      quality. Accurate 3-min explainer of Guijarro-Ordonez, Pelger & Zanotti,
      "Deep Learning Statistical Arbitrage" (arXiv 2106.04028, 68pp) - I pulled
      the paper and every claim checks out. Method: residual portfolios from
      IPCA latent factors, 30-day lookback, CNN (local trend/reversal filters)
      + 1-layer transformer (4 attention heads), trained DIRECTLY on a Sharpe
      objective rather than return prediction. OOS Jan-2002..Dec-2016.
      Gross Sharpe 4.16 (frame 8) vs ~2 Fourier+FFN vs ~1 OU+threshold.
      THE NUMBER THAT MATTERS - paper Section III.J, net of 5bps/transaction +
      1bp short-holding: "Sharpe ratios are lower and range from 0.94 to 1.24".
      Our SPY champion is 1.17, i.e. INSIDE that band. The 4x headline is a
      pre-cost number and the creator says so on camera, to his credit.
      Not implementable as-is - our engine is long-only single-symbol
      fn(df,params)->0/1; this needs market-neutral long/short over ~550 names.
      Real value would be DIVERSIFICATION (uncorrelated to our long-only book),
      not higher standalone Sharpe. See Strategy Ideas for the engine-work note.

  - url: https://www.instagram.com/reel/DeF6WMaB-NX/
    name: "Overnight vs Intraday return decomposition (Knuteson)"
    status: backtested
    cache_key: 523a7fb765bc
    tags: [equities, overnight-effect, anomaly, legit, cost-killed]
    note: >-
      BACKTESTED - real anomaly, killed by costs. Claim: holding only
      overnight (close->open) captures all the return; intraday (open->close)
      loses it. Verified on our own daily OHLC, no new data needed.
      DECOMPOSITION IS EXACT - (overnight x intraday) reproduces buy&hold to
      the dollar on MU/SPY/QQQ, so the method is sound.
      GROSS it is spectacular: MU overnight +7,738,122% vs buy&hold +4,154%,
      intraday -100%. SPY overnight sharpe 0.75 vs buy&hold 0.45.
      AT OUR 5bps/side IT IS CATASTROPHIC: the overnight leg round-trips EVERY
      session (~25%/yr friction). SPY -99% total, sharpe -1.42. QQQ -96%,
      sharpe -0.80. Only MU survives (sharpe 0.54) and only because its
      overnight drift is enormous.
      At 1bp/side (institutional execution we do not have) SPY +130% sharpe
      0.27 - still BELOW buy&hold's 0.45. QQQ 0.58 beats buy&hold 0.41.
      VERDICT: do not trade. Textbook demonstration of why costs default ON.
      Closes the 'Overnight/close-to-open effects' item in Strategy Ideas.


