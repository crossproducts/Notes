  - url: https://www.instagram.com/reel/DeF5_5yPtDb/
    name: Efficiency-Ratio Forecast Gate (ML meta-filter)
    status: backtested
    cache_key: 114edfdb3d01
    tags: [equities, ml, regime-filter, meta-filter, falsified]
    note: >-
      FAILS on daily equity indices. A logistic regression over 15
      price-movement features predicts next-day efficiency (|C-O|/(H-L)) and
      gates a base strategy. Rebuilt and tested strictly OOS (expanding-window
      refit, train-only standardisation + tercile cuts). Model has almost no
      skill - OOS AUC 0.519 SPY / 0.538 QQQ, and accuracy is BELOW the
      majority-class baseline on both. The reel's monotonic low/med/high table
      does not reproduce: next-day return by predicted bucket is 5.76/6.69/5.71
      bps on SPY, and profit factor DECREASES with predicted efficiency.
      Gating hurt 10/10 strategy-instrument combinations (SPY+QQQ x momentum,
      mean_reversion, breakout, trend_ma, macd) - e.g. SPY momentum sharpe
      0.39 -> 0.05, return 270% -> 98%. Mechanism of harm is clear - a daily
      on/off gate shreds held positions into churn (trend_ma switches 15 ->
      643) and pays costs on every interruption. Caveat - his base strategy is
      unnamed with 829 trades, so likely intraday; untested there.

