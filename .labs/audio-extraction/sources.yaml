  - url: https://www.instagram.com/reel/DeQiyXQRNzd/
    name: "Heston intraday periodicity (half-hour momentum)"
    status: skipped
    cache_key: 701ea111c21e
    tags: [equities, intraday, cross-sectional, legit, engine-gap]
    note: >-
      LEGIT but blocked on the engine - highest-value engine-gap item after
      the stat-arb reel. This is Heston, Korajczyk & Sadka, "Intraday Patterns
      in the Cross-section of Stock Returns" (Journal of Finance): 1700+ NYSE
      names, 5 years, half-hour bins. Today's top-decile half-hour beats the
      bottom decile AT THE SAME HALF-HOUR tomorrow, persisting ~40 trading
      days; reverses at other times of day; strongest in the first and last
      half hour. Mechanism is institutional order-slicing on a daily clock.
      BLOCKED: needs intraday (30-min) bars across a wide cross-section plus a
      cross-sectional ranking engine. We are daily, single-symbol, long-only.
      Alpaca does supply minute bars, so the DATA is reachable; the ENGINE is
      not. See Trading/Engine Backlog.md.


