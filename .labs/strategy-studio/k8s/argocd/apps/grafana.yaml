apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: studio-grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/crossproducts/Notes.git
    targetRevision: main
    path: .labs/strategy-studio/k8s/manifests/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: strategy-studio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
