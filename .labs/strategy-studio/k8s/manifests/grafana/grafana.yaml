apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: strategy-studio
data:
  studio.yml: |
    apiVersion: 1
    datasources:
      - name: StudioDB
        uid: studiodb
        type: postgres
        access: proxy
        url: $STUDIO_DB_HOST:5432
        user: studio
        isDefault: true
        jsonData:
          database: backtests
          sslmode: require
        secureJsonData:
          password: $STUDIO_DB_PASSWORD
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: strategy-studio
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: strategy-studio
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana-oss:latest
          ports:
            - containerPort: 3000
          env:
            # Expanded inside the datasource yml above (Grafana env interpolation)
            - name: STUDIO_DB_HOST
              valueFrom:
                secretKeyRef: { name: studio-db, key: db_host }
            - name: STUDIO_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: studio-db, key: db_password }
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: strategy-studio
spec:
  selector: { app: grafana }
  ports:
    - port: 3000
      targetPort: 3000
