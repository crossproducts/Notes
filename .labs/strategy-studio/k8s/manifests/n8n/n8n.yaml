apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: strategy-studio
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 5Gi }
  # gp3 via the EBS CSI addon installed by the EKS module
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: strategy-studio
spec:
  replicas: 1
  strategy: { type: Recreate } # RWO volume: never two pods at once
  selector:
    matchLabels: { app: n8n }
  template:
    metadata:
      labels: { app: n8n }
    spec:
      containers:
        - name: n8n
          image: n8nio/n8n:latest
          ports:
            - containerPort: 5678
          env:
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: GENERIC_TIMEZONE
              value: America/New_York
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: strategy-studio
spec:
  selector: { app: n8n }
  ports:
    - port: 5678
      targetPort: 5678
