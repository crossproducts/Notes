apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest-api
  namespace: strategy-studio
spec:
  replicas: 1
  selector:
    matchLabels: { app: backtest-api }
  template:
    metadata:
      labels: { app: backtest-api }
    spec:
      containers:
        - name: api
          # Push with: docker build -t <acct>.dkr.ecr.us-east-1.amazonaws.com/strategy-studio/backtest-api:v1 backtest-api/
          image: CHANGE_ME_ECR_URL/strategy-studio/backtest-api:v1
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: studio-db     # create via sealed-secrets — see secret.example.yaml
                  key: database_url
            - name: OLLAMA_URL
              value: "http://ollama.strategy-studio.svc:11434" # or drop the analyst in-cluster
            - name: IMPORTED_DIR
              value: "/app/imported" # video strategies: bake into image or mount a volume
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backtest-api
  namespace: strategy-studio
spec:
  selector: { app: backtest-api }
  ports:
    - port: 8000
      targetPort: 8000
