# DO NOT commit a real Secret. Per repo rules (and the 2026-05-11 lesson):
# base64 is NOT redaction. Use sealed-secrets, exactly like the opus-k8s lab:
#
#   kubectl create secret generic studio-db -n strategy-studio \
#     --from-literal=database_url="postgresql://studio:<pw>@<rds-endpoint>:5432/backtests" \
#     --from-literal=db_host="<rds-endpoint>" \
#     --from-literal=db_password="<pw>" \
#     --dry-run=client -o yaml | kubeseal -o yaml > secret.sealed.yaml
#
# Commit ONLY secret.sealed.yaml. The RDS password comes from Secrets Manager
# (manage_master_user_password=true in infra/live/dev/rds).
#
# This file is a shape reference only:
apiVersion: v1
kind: Secret
metadata:
  name: studio-db
  namespace: strategy-studio
stringData:
  database_url: postgresql://studio:REPLACE_ME@REPLACE-RDS-ENDPOINT:5432/backtests
  db_host: REPLACE-RDS-ENDPOINT
  db_password: REPLACE_ME
