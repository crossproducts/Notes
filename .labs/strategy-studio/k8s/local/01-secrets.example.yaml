# Copy to 01-secrets.yaml (gitignored) and fill in real values, or create
# directly: kubectl create secret generic studio-secrets -n strategy-studio \
#   --from-literal=ALPACA_API_KEY=xxx --from-literal=ALPACA_SECRET_KEY=xxx
apiVersion: v1
kind: Secret
metadata:
  name: studio-secrets
  namespace: strategy-studio
type: Opaque
stringData:
  ALPACA_API_KEY: "xxx"
  ALPACA_SECRET_KEY: "xxx"
  OANDA_API_KEY: "xxx"
  OANDA_ACCOUNT_ID: "xxx"
  QUIVER_API_KEY: "xxx"
  GMAIL_ADDRESS: "xxx"
  GMAIL_APP_PASSWORD: "xxx"
  DEFAULT_RECIPIENT: "xxx"
---
apiVersion: v1
kind: Secret
metadata:
  name: studio-db
  namespace: strategy-studio
type: Opaque
stringData:
  database_url: "postgresql://studio:studio@postgres:5432/backtests"
  db_host: "postgres"
  db_password: "studio"
